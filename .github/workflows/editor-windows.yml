# Pattern editor fork: build a Windows installer on every push to pattern-editor, or by
# hand from the Actions tab. The installer is attached to the run as an artifact.
name: Pattern editor (Windows)

on:
  push:
    branches: [pattern-editor]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the core
        run: cargo test --locked

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build the installer
        working-directory: app
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: sparkymk2-pattern-editor-windows
          path: target/release/bundle/nsis/*.exe
